name: favorite_places
description: Favorite Places App - Flutter assignment
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Storage
  path_provider: ^2.1.3
  path: ^1.9.0
  uuid: ^4.4.0

  # Image handling
  image_picker: ^1.1.2

  # Location & Map (OpenStreetMap — no API key)
  geolocator: ^12.0.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  http: ^1.2.1

  # Formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true